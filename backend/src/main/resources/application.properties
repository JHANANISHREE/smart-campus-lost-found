# =====================================================================
# SMART CAMPUS LOST & FOUND MANAGEMENT SYSTEM
# Spring Boot Application Configuration
# =====================================================================

spring.application.name=smart-campus-lost-found
server.port=8080

# ---------------------------------------------------------------------
# Primary Database Connection: MySQL 8.0+
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_lost_found?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA & Hibernate Settings
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Multipart File Upload Settings
# ---------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/

# ---------------------------------------------------------------------
# JWT Security Configuration
# ---------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# ---------------------------------------------------------------------
# Default Admin Credentials for Bootstrap Initialization
# ---------------------------------------------------------------------
app.bootstrap.admin.email=admin@campus.edu
app.bootstrap.admin.password=Admin@123
app.bootstrap.admin.name=Campus Security Administrator

# Default Demo Student Credentials
app.bootstrap.student.email=student@campus.edu
app.bootstrap.student.password=Student@123
app.bootstrap.student.name=Aarav Sharma
